services:
  # ────────────────────────────────────────────
  # Node.js Backend (Express + MongoDB)
  # ────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: caregiver-backend
    ports:
      - "3000:3000"
    env_file:
      - ./backend/.env
    environment:
      - ML_SERVICE_URL=http://ml-service:8001
      - AI_SERVICE_URL=http://ai-service:8000
    volumes:
      # Production: only mount admin JSON, not source code
      - ./backend/admin:/app/admin
    restart: unless-stopped
    depends_on:
      - ml-service
      - ai-service
    networks:
      - app-network

  # ────────────────────────────────────────────
  # AI Service (FastAPI + Groq/LLaMA)
  # ────────────────────────────────────────────
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: caregiver-ai-service
    ports:
      # Bind to localhost only — not publicly accessible, only backend can reach it
      - "127.0.0.1:8000:8000"
    env_file:
      - ./ai-service/.env
    # Override dev CMD: remove --reload, add workers for production
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "2"]
    restart: unless-stopped
    networks:
      - app-network

  # ────────────────────────────────────────────
  # ML Service (FastAPI + Stress Prediction)
  # ────────────────────────────────────────────
  ml-service:
    build:
      context: ./stress_prediction
      dockerfile: Dockerfile
    container_name: caregiver-ml-service
    ports:
      # Bind to localhost only — not publicly accessible
      - "127.0.0.1:8001:8001"
    volumes:
      # Mount model directory as a named volume so artifacts can be updated
      # on the VPS without rebuilding the entire image.
      # To push new model files: scp/rsync stress_model/ → server, then
      # docker compose restart ml-service (no rebuild needed).
      - ml-model-data:/app/stress_model
    restart: unless-stopped
    networks:
      - app-network

volumes:
  ml-model-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./stress_prediction/stress_model

networks:
  app-network:
    driver: bridge
