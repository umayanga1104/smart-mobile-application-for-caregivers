# docker-compose.yml
version: "3.8"

services:
  # ────────────────────────────────────────────
  # Node.js Backend (Express + MongoDB)
  # ────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: caregiver-backend
    ports:
      - "3000:3000"
    env_file:
      - ./backend/.env
    environment:
      - ML_SERVICE_URL=http://ml-service:8001
      - AI_SERVICE_URL=http://ai-service:8000
    volumes:
      # ⚡ THIS IS THE KEY — mounts your local source into the container
      # Every time you save a file, nodemon inside the container picks it up
      - ./backend/src:/app/src
      - ./backend/admin:/app/admin
      # Anonymous volume to prevent overwriting node_modules inside container
      - /app/node_modules
    restart: unless-stopped
    depends_on:
      - ml-service
    networks:
      - app-network

  # ────────────────────────────────────────────
  # AI Service (FastAPI + Groq/LLaMA)
  # ────────────────────────────────────────────
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: caregiver-ai-service
    ports:
      - "8000:8000"
    env_file:
      - ./ai-service/.env
    volumes:
      # ⚡ Mount local source so changes auto-reload via uvicorn --reload
      - ./ai-service/app:/app/app
    restart: unless-stopped
    networks:
      - app-network

  # ────────────────────────────────────────────
  # ML Service (FastAPI + Stress Prediction)
  # ────────────────────────────────────────────
  ml-service:
    build:
      context: ./stress_prediction
      dockerfile: Dockerfile
    container_name: caregiver-ml-service
    ports:
      - "8001:8001"
    restart: unless-stopped
    networks:
      - app-network

networks:
  app-network:
    driver: bridge